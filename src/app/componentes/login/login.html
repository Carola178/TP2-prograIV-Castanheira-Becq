<div class="login-container">
    <div class="login-card">
        <div class="login-header">
        <img src="logo.png" alt="Patitas al refugio" class="login-logo">
        <h2>Patitas al Refugio</h2>
        <p>Ingresá con tu correo o nombre de usuario</p>
        </div>

        <!-- @if (errorMessage()) {
        <div class="error-banner">
            {{ errorMessage() }}
        </div>
        } -->

        <form class="login-form" [formGroup]="loginModel" (ngSubmit)="onSubmit($event)">
        <div class="form-group">
            <label for="identifier">Usuario o Correo Electrónico</label>
            <input type="text" id="identifier" formControlName="email" placeholder="usuario o correo@ejemplo.com">
            
            <!-- @if (loginModel.controls.email.touched && loginModel.controls.email.invalid) {
            <small class="texto-error">Ingresa un usuario o correo válido.</small>
            } -->
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" formControlName="password" placeholder="••••••••">
            
            @if (loginModel.controls.password.touched && loginModel.controls.password.invalid) {
            <small class="texto-error">La contraseña no es válida. </small>
            }
        </div>

        <div class="button-group">
            <button type="submit" class="btn-primary" [disabled]="!loginModel.valid">Ingresar</button>
            <!-- <button type="button" class="btn-secondary" (click)="errorMessage.set(null)">Limpiar</button> -->
        </div>
        </form>

        <hr class="divisor" />

        <div class="registro-link-container">
        <p class="texto-pregunta">¿No tenés cuenta aún?</p>
        <a routerLink="/registro">Registrate</a>
        </div>
    </div>
</div>
