<div class="registro-container">
    <div class="registro-card">
        <div class="registro-header">
        <img src="logo.png" alt="Patitas al refugio" class="registro-logo">
        <h2>Registro de Usuarios</h2>
        <p>Unite a la comunidad de Patitas al Refugio</p>
        </div>

        <form class="registroFormulario" [formGroup]="registroModel" (ngSubmit)="onSubmit($event)">
        
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" formControlName="nombre" placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" formControlName="apellido" placeholder="Tu apellido">
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" formControlName="email" placeholder="usuario@correo.com">
        </div>

        <div class="form-group">
            <label for="nombre_usuario">Nombre de Usuario</label>
            <input type="text" id="nombre_usuario" formControlName="nombreUsuario" placeholder="usuario123">
        </div>

        <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <input type="text" id="fecha_nacimiento" formControlName="fechaNacimiento" placeholder="dd/mm/aaaa">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción Breve</label>
            <textarea id="descripcion" formControlName="descripcion" rows="2" placeholder="Contanos algo sobre vos..."></textarea>
        </div>

        <div class="form-group">
            <label for="imagen_perfil">Imagen de Perfil</label>
            <input type="file" id="imagen_perfil" formControlName="imagenPerfil" accept="image/*">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" formControlName="password" placeholder="••••••••">
            <small class="texto-ayuda">Mínimo 8 caracteres, una mayúscula y un número.</small>
        </div>

        <div class="form-group">
            <label for="repetir_password">Repetir Contraseña</label>
            <input type="password" id="repetir_password" formControlName="repetirPassword" placeholder="••••••••">
        </div>

        <div class="button-group">
            <button type="submit" class="btn-primary" [disabled]="!registroModel.valid">Crear cuenta</button>
            <button type="reset" class="btn-secondary">Limpiar</button>
        </div>
        </form>

        <div class="login-link-container">
        <p class="texto-pregunta">¿Ya tenés una cuenta?</p>
        <a routerLink="/login">Iniciá sesión</a>
        </div>
    </div>
</div>
